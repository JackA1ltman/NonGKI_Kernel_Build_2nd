name: 'Patch fgetpriority for Kernel.'

runs:
  using: 'composite'
  steps:
      - name: Patch fgetpriority
        if: env.FGETPRIORITY_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          # Check if fgetpriority is not already present in drivers/Kconfig
          if ! grep -q "fgetpriority" "drivers/Kconfig"; then

            # Clean up any leftover directory before cloning
            rm -rf fgetpriority
            git clone --depth=1 https://github.com/aerath-stuff/fgetpriority.git fgetpriority

            # Verify whether Kconfig is inside fgetpriority/kernel or the repository root
            SRC=fgetpriority/kernel
            [ -f "$SRC/Kconfig" ] || SRC=fgetpriority
            if [ ! -f "$SRC/Kconfig" ]; then
              echo "[-] Error: fgetpriority Kconfig not found in the cloned repository."
              exit 1
            fi

            # Symlink source and register it in drivers Makefile and Kconfig
            ln -sfn "../$SRC" drivers/fgetpriority
            grep -q "CONFIG_FGETPRIORITY" drivers/Makefile || echo 'obj-$(CONFIG_FGETPRIORITY) += fgetpriority/' >> drivers/Makefile
            grep -q "drivers/fgetpriority/Kconfig" drivers/Kconfig || sed -i '/^endmenu/i source "drivers/fgetpriority/Kconfig"' drivers/Kconfig

            # Enable the config flag in the target defconfig
            echo "CONFIG_FGETPRIORITY=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

            echo "[+] Patched fgetpriority for your kernel successfully."
          else

            echo "[-] Kernel already has fgetpriority embedded, skipped."
          fi
