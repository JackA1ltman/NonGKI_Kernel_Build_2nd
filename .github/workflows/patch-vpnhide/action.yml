name: 'Patch VPNHide for Kernel.'

runs:
  using: 'composite'
  steps:
      - name: Patch VPNHide
        if: env.VPNHIDE_ENABLE == 'true'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel/"

          # Patch only if the VPNHIDE symbol is not already defined in any Kconfig
          if ! grep -rqsE --include='Kconfig*' '^config[[:space:]]+VPNHIDE[[:space:]]*$' . ; then

            # Clean up any leftover directory before cloning
            rm -rf vpnhide
            git clone --depth=1 https://github.com/soranerai/vpnhide_next_backend.git vpnhide
            chmod +x vpnhide/kpatch/scripts/apply.sh

            KVER="${{ env.KERNEL_VERSION }}"

            case "$KVER" in
              5.4)
                ./vpnhide/kpatch/scripts/apply.sh . android12-5.4
                ;;
              4.19|4.14|4.9)
                ./vpnhide/kpatch/scripts/apply.sh . "upstream-$KVER"
                ;;
              *)
                echo "[-] Kernel version $KVER not supported!"
                exit 1
                ;;
            esac

            # Enable the config flag in the target defconfig
            echo "CONFIG_VPNHIDE=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

            echo "[+] Patched VPNHide for your kernel successfully."
          else

            echo "[-] Kernel already has VPNHide embedded, skipped."
          fi
