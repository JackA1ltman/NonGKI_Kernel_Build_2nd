name: Build Google Pixel 3a (LineageOS 22.2 A15)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device identity
  DEVICE_NAME: "google_pixel_3a"
  DEVICE_CODENAME: "bonito"

  # build.config.common.clang uses Clang with this target triple. The GCC
  # toolchains below provide the AArch64 and ARM32 binutils/cross-compilers.
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-64/bin/aarch64-linux-android- CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc-32/bin/arm-linux-androideabi-"
  EXTRA_CMDS: "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang-custom/lib64"

  # Kernel source
  KERNEL_SOURCE: "https://github.com/LineageOS/android_kernel_google_msm-4.9.git"
  KERNEL_BRANCH: "lineage-22.2"

  # build.config.common selects clang-r416183b.
  CLANG_SOURCE: "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH: "lineage-20.0"

  # These match the Android 4.9 GCC toolchain families referenced by build.config.common.
  GCC_GNU: "false"
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "lineage-19.1"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "lineage-19.1"

  # Defconfig
  DEFCONFIG_SOURCE: "" # Optional direct URL for a replacement defconfig file.
  DEFCONFIG_NAME: "bonito_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: "" # Optional boot/kernel image URL used to extract a defconfig.
  DEFCONFIG_FROM_BOOT: "false"

  # KernelSU: ReSukiSU with SuSFS
  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "resukisu"
  KERNELSU_METHOD: "shell" # shell, manual, or only.

  SUSFS_ENABLE: "true"
  SUSFS_FIXED: "true" # Set true only when a device-specific secondary patch is supplied below.
  PATCHES_SOURCE: "smmauck/NonGKI_Kernel_Patches" # GitHub owner/repository, without a URL or .git suffix.
  PATCHES_BRANCH: "main"
  SUSFS_FOLDER_FIXED: "pixel_3a_lineageos22_2_a15"
  SUSFS_PATCH_FIXED: "susfs_patch_to_4.9_secondary" # Comma-separated patch names without .patch.

  # Packaging
  PACK_METHOD: "Anykernel3"
  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"
  BOOT_SOURCE: "" # Used only by MKBOOTIMG packaging.
  PACK_KMODULES: "false"
  ROM_TEXT: "lineageos22_2_a15"

  # bonito_defconfig builds the QCOM DTBs and dtbo.img directly.
  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom" # Used only if GENERATE_DTB is enabled later.

  # Optional integrations (disabled for this device configuration)
  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  # SuSFS builds use the inline hook path in patch-no-kprobe; syscall is the fallback without SuSFS.
  HOOK_METHOD: "syscall"

  # Optional KPM support
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  # Build diagnostics and extra config merging
  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "" # Comma-separated paths relative to arch/arm64/configs/.

  # Runner setup
  PYTHON_VERSION: "3"
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Google Pixel 3a (LineageOS 22.2 A15)
    runs-on: ubuntu-22.04
    # Supported alternatives used by mainline are ubuntu-24.04/22.04 and
    # containers such as ubuntu:focal or archlinux/archlinux:latest.
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SuSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd $GITHUB_WORKSPACE/device_kernel
          # Nothing

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
