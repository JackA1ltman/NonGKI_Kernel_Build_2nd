name: Build and Release Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      build-kernel:
        description: 'Build Kernel ?'
        required: true
        type: boolean
        default: true

      release-kernel:
        description: 'Release Kernel ?'
        required: true
        type: boolean
        default: true

  schedule:
    - cron: '0 3 * * 3'

jobs:
  build-kernel:
    name: "Step Build Kernel"
    uses: ./.github/workflows/build-kernel.yml
    secrets: inherit
    strategy:
      fail-fast: true
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.build-kernel == true)

  release-kernel:
    name: "Step Release Kernel"
    runs-on: ubuntu-24.04
    needs:
      - build-kernel
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.release-kernel == true)
    env:
      REPO_OWNER: JackA1ltman
      REPO_NAME: NonGKI_Kernel_Build
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NAME: "Pre-built"
      RELEASE_NOTES: |
        Below is the codename reference table. Please select the image or archive you need based on this table.

        | Device Name | Codename | Kernel | System | Android | Method | KernelSU | SUSFS | Re:Kernel | BBG | NoMount |
        |----------|----------|----------|----------|----------|----------|----------|----------|----------|----------|----------|
        | Google Pixel 3a | bonito | 4.9 | LineageOS 22.2 | 15 | AnyKernel3 | ReSukiSU | ✅ | ❌ | ❌ | ✅ |
        | Nothing Phone (1) | spacewar | 5.4 | LineageOS 23.2 | 16 | AnyKernel3 | ReSukiSU | ✅ | ❌ | ❌ | ❌ |
        | OnePlus 8 | instantnoodle | 4.19 | OxygenOS 13.1 | 13 | AnyKernel3 | ReSukiSU | ✅ | ❌ | ✅ | ❌ |
        | OnePlus 8 | instantnoodle | 4.19 | ColorOS 15 | 15 | AnyKernel3 | ReSukiSU | ✅ | ❌ | ✅ | ❌ |
        | Samsung Galaxy A71 | a71 | 4.14 | AOSP Based & OneUI | 16 | AnyKernel3 | ReSukiSU | ✅ | ✅ | ✅ | ❌ |
        | Samsung Galaxy Note10 | d1 | 4.14 | OneUI 7 | 15 | AnyKernel3 | ReSukiSU | ✅ | ❌ | ❌ | ❌ |
        | Samsung Galaxy Note10+ | d2s | 4.14 | OneUI 7 | 15 | AnyKernel3 | ReSukiSU | ✅ | ❌ | ❌ | ❌ |
        | Smartisan R1 | trident | 4.9 | Smartisan OS | 8.1 | AnyKernel3 | xxKSU | ❌ | ❌ | ❌ | ❌ |
        | Smartisan U3 Pro | osborn | 4.4 | LineageOS 18 | 11 | AnyKernel3 | xxKSU | ❌ | ❌ | ❌ | ❌ |
        | Xiaomi Mi 11 | venus | 5.4 | Evolution X 11.X | 16 | AnyKernel3 | ReSukiSU | ✅ | ✅ | ❌ | ❌ |
        | Xiaomi Mi MIX 2S | polaris | 4.9 | Evolution X 10.X | 15 | AnyKernel3 | ReSukiSU | ✅ | ✅ | ✅ | ❌ |
        | Xiaomi Mi MIX 2S | polaris | 4.19 | AOSP Based | 16 | AnyKernel3 | ReSukiSU | ✅ | ❌ | ❌ | ❌ |
        | Xiaomi Mi Pad 4 | clover | 4.19 | LineageOS 22 | 15 | AnyKernel3 | ReSukiSU | ✅ | ❌ | ❌ | ❌ |
        | Xiaomi Redmi 8 | olive | 4.19 | AOSP Based | 15 | AnyKernel3 | ReSukiSU | ✅ | ✅ | ✅ | ❌ |
        | Xiaomi Redmi K20 Pro | raphael | 4.14 | AOSP Based | 15 | AnyKernel3 | ReSukiSU | ✅ | ❌ | ❌ | ❌ |
        | Xiaomi Redmi K30 Ultra | cezanne | 4.14 | AOSP Based | 14 | AnyKernel3 | ReSukiSU | ✅ | ✅ | ✅ | ❌ |
        | Xiaomi Redmi Note 7 | lavender | 4.19 | AOSP Based | 15 | AnyKernel3 | ReSukiSU | ✅ | ❌ | ❌ | ❌ |
        | Xiaomi Redmi Note 11 Pro 5G | veux | 5.4 | AOSP Based | 16 | AnyKernel3 | ReSukiSU | ✅ | ❌ | ❌ | ❌ |

        - Specific device information: [Supported List](Supported_list.md).
        - The KernelSU version is for reference only. It is normal for the KernelSU version embedded in SUSFS to be lower.

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v6

      # Download Artifacts
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          merge-multiple: true
          skip-decompress: true

      # Get the Latest Tag from GitHub
      - name: Generate and Create New Tag
        run: |
          # Fetch the latest tag from GitHub (this is the latest tag based on the GitHub API)
          LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name')
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0000000001" # if have no any releases.
          fi

          NEW_TAG=$(date +%s)

          # Output the new tag to be used
          echo "New tag: $NEW_TAG"

          # Set the new tag as an environment variable to be used in later steps
          TIME=$(date +"%Y-%m-%d %H:%M")
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV

          # Create the tag in the repository
          git tag $NEW_TAG
          git push --tags

          # Get KernelSU version
          git clone -b master https://github.com/backslashxx/KernelSU.git KernelSU-xxKSU
          KSU_XXKSU_VERSION=$(cd KernelSU-xxKSU && expr $(/usr/bin/git rev-list --count HEAD) + 30000 - 82)
          git clone -b main https://github.com/rsuntk/KernelSU.git KernelSU-rsuntk
          KSU_RSUNTK_VERSION=$(cd KernelSU-rsuntk && expr $(/usr/bin/git rev-list --count HEAD) + 29971)
          git clone -b builtin https://github.com/ShirkNeko/SukiSU-Ultra.git KernelSU-SukiSU-Ultra
          KSU_SUKISU_ULTRA_VERSION=$(cd KernelSU-SukiSU-Ultra && expr $(/usr/bin/git rev-list --count HEAD) + 40000 - 2815)
          git clone -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          KSU_NEXT_VERSION=$(cd KernelSU-Next && expr $(/usr/bin/git rev-list --count HEAD) + 30000)
          git clone -b main https://github.com/ReSukiSU/ReSukiSU.git KernelSU-ReSukiSU
          KSU_RESUKISU_VERSION=$(cd KernelSU-ReSukiSU && expr $(/usr/bin/git rev-list --count HEAD) + 30000 + 700)

          # Input release note
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "[KernelSU-xxKSU](https://github.com/backslashxx/KernelSU) Version: $KSU_XXKSU_VERSION  " >> $GITHUB_ENV
          echo "[KernelSU-rsuntk](https://github.com/rsuntk/KernelSU) Version: $KSU_RSUNTK_VERSION  " >> $GITHUB_ENV
          echo "[KernelSU-SukiSU-Ultra](https://github.com/ShirkNeko/SukiSU-Ultra) Version: $KSU_SUKISU_ULTRA_VERSION  " >> $GITHUB_ENV
          echo "[KernelSU-Next](https://github.com/KernelSU-Next/KernelSU-Next) Version: $KSU_NEXT_VERSION  " >> $GITHUB_ENV
          echo "[KernelSU-ReSukiSU](https://github.com/ReSukiSU/ReSukiSU) Version: $KSU_RESUKISU_VERSION  " >> $GITHUB_ENV
          echo "[KernelSU-ReSukiSU-CI](https://github.com/cctv18/ReSukiSU_CI) Version: $KSU_RESUKISU_VERSION  " >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # Create GitHub Release and upload files if make_release is true
      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          prerelease: false
          release_name: "${{ env.RELEASE_NAME }} ${{ env.TIME }}"
          body: ${{ env.RELEASE_NOTES }}

      - name: Upload Release Assets Dynamically
        run: |
          # Loop through all files in the downloaded-artifacts directory
          for file in ./downloaded-artifacts/*; do
              # Skip directories
              if [ -d "$file" ]; then
                  continue
              fi

              # Upload the file to the GitHub release
              echo "Uploading $file..."
              gh release upload ${{ env.NEW_TAG }} "$file"
          done

      # Display Files Uploaded
      - name: Display Files Uploaded
        run: |
          echo "GitHub release created with the following files:"
          ls ./downloaded-artifacts/*
