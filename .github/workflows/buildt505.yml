name: Build Onelus 8 Series (OxygenOS 13 A13) (XTD Kernel)  # 🔄 CHANGE: Update to "Build Galaxy Tab A7 T505 (Based AOSP A15) (Kernel 4.19)"

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "oneplus_8_cn"  # 🔄 CHANGE: Update to "samsung_galaxy_tab_a7"
  DEVICE_CODENAME : "instantnoodle"  # 🔄 CHANGE: Update to "gta7wifi"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld"

  KERNEL_SOURCE : "https://github.com/thanhsangdcs/Kernel-sst505.git"  # 🔄 CHANGE: Update to Galaxy Tab A7 T505 kernel source
  KERNEL_BRANCH : "main"  # 🔄 CHANGE: Update to appropriate branch for T505

  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-Linux-X64.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://github.com/JackA1ltman/Google-GCC-Android-4.9.git"  # 🔄 CHANGE: May need original GCC source
  GCC_64_BRANCH : "aarch64"
  GCC_32_SOURCE : "https://github.com/JackA1ltman/Google-GCC-Android-4.9.git"  # 🔄 CHANGE: May need original GCC source
  GCC_32_BRANCH : "arm32"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "gta4l_eur_open_defconfig"  # 🔄 CHANGE: Update to "vendor/gta4l_eur_open_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh"  # 🔄 CHANGE: May need different KernelSU version
  KERNELSU_BRANCH : "12124+155"  # 🔄 CHANGE: May need different branch

  KERNELSU_AUTO_GET : "true" # if u want easy setting kernelsu, u can true.
  KERNELSU_AUTO_FORK : "rsuntk" # magic, rsuntk , next and sukisu

  SUSFS_ENABLE : true
  SUSFS_FIXED : true
  SUSFS_UPDATE : false

  AK3_SOURCE : "https://github.com/JackA1ltman/OP8_AnyKernel3.git"  # 🔄 CHANGE: Update to AnyKernel3 for Galaxy Tab A7
  AK3_BRANCH : "main"  # 🔄 CHANGE: Update to appropriate branch

  BOOT_SOURCE : ""

  NEED_DTBO : false  # 🔄 CHANGE: Check if T505 needs DTBO
  NEED_SAFE_DTBO : false  # 🔄 CHANGE: Check if T505 needs safe DTBO

  ROM_TEXT : "oxygen13.1_a13"  # 🔄 CHANGE: Update to "based_aosp_a15" or appropriate ROM

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"  # 🔄 CHANGE: May need different patches for T505
  PATCHES_BRANCH: "op_kernel"  # 🔄 CHANGE: Update branch

  SUSFS_FOLDER_FIXED: "kona_oos"  # 🔄 CHANGE: Update to "gta7wifi_aosp" or similar
  SUSFS_155_FIXED: "namespace_fixed,task_mmu_fixed"  # 🔄 CHANGE: May need different patches
  SUSFS_LATEST_FIXED: ""  # 🔄 CHANGE: May need different patches

  REKERNEL_ENABLE: "false"

  HOOK_METHOD: "normal"  # 🔄 CHANGE: May need "tracepoint" for kernel 4.19
  HOOK_OLDER: "false"

  KPM_ENABLE: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  GENERATE_DTB: "false"  # 🔄 CHANGE: Check if T505 needs DTB generation
  GENERATE_CHIP: "qcom"  # ✅ KEEP: Snapdragon 662 is Qualcomm

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"  # ✅ KEEP: No merge config needed for T505
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"  # 🔄 CHANGE: Empty or remove since BUILD_OTHER_CONFIG is false

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Onelus 8 Series (OxygenOS 13 A13) (XTD Kernel)  # 🔄 CHANGE: Update to "Galaxy Tab A7 T505 (Based AOSP A15) (Kernel 4.19)"
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd $GITHUB_WORKSPACE/device_kernel
          echo "CONFIG_CPU_BIG_ENDIAN=n" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_COMPAT_VDSO=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_LTO_NONE=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_INIT_STACK_NONE=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KPROBES=n" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i 's/# CONFIG_SECCOMP is not set/CONFIG_SECCOMP=y/' ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}

          # sed -i 's|\$(obj)/config_data.gz: [^ ]* FORCE|\$(obj)/config_data.gz: $(KCONFIG_CONFIG) FORCE|' kernel/Makefile

          # kernel_compat fixed  # 🔄 CHANGE: May need different patches for T505
          cp NonGKI_Kernel_Patches/kona_oos/compat_fixed.patch ./
          patch -p1 < compat_fixed.patch

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
