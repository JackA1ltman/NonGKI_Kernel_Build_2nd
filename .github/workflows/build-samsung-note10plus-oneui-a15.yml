name: Build Samsung Note 10 Plus (OneUI A15)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "samsung_note_10plus"
  DEVICE_CODENAME : "d2s"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE : "https://github.com/JackA1ltman/ExtremeKernel_noksu.git"
  KERNEL_BRANCH : "main"

  CLANG_SOURCE : "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "exynos9820_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu" # xxksu, rsuntk , next, resukisu and sukisu

  SUSFS_ENABLE : true
  SUSFS_FIXED : true

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "oneui_a15"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "Anykernel3" # Anykernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false" # if u want pack kernel modules (.ko) into Anykernel3.

  KERNELSU_METHOD: "shell" # shell, manual and only.

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches" # [your_name]/[your_patch] -> gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "samsung_kernel" # [your_branch] -> main

  SUSFS_FOLDER_FIXED: "note10_plus_exyons9850" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "susfs_fixed" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2

  REKERNEL_ENABLE: "false" # if u need Re:Kernel.
  DROIDSPACES_ENABLE: "false" # if u need Droidspaces or LXC/Docker.
  NOMOUNT_ENABLE: "true" # if u need NoMount.

  HOOK_METHOD: "syscall" # Manual hook method ->  syscall.

  KERNEL_PATCH: "true" # If your kernel version is <= 4.9, you have the option of enabling the patch to patch the kernel_write and kernel_read functions.

  KPM_ENABLE: "true" # Anyone devices.
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "true" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: "true" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only Anykernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "false" # Output build errors.
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "true" # Merge config files.
  MERGE_CONFIG_FILES: "d2s.config"

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: Samsung Note 10 Plus (OneUI A15)
    runs-on: ubuntu-latest # u can changed to ubuntu 22.04, and need container set ubuntu-latest
    # container: archlinux/archlinux:latest # if u need use arch linux -> archlinux/archlinux:latest or ubuntu 20.04 -> ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 🛡️ Backup Patches Directory
        shell: bash
        run: |
          echo "[+] Patches klasörü güvenli bölgeye (/tmp/Patches_Backup) kopyalanıyor..."
          cp -r $GITHUB_WORKSPACE/Patches /tmp/Patches_Backup
          echo "[+] Yedekleme tamam. /tmp/Patches_Backup içeriği:"
          ls -la /tmp/Patches_Backup
      # ========================================

      - name: 🔍 List Patches directory
        shell: bash
        run: |
          ls -la $GITHUB_WORKSPACE/Patches/ || echo "Patches Workspace'de bulunamadı (Zaten yedekledik)"
          echo "---"
          find /tmp/Patches_Backup -maxdepth 2 -type f

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🩹 Apply backport patches
        if: env.KERNEL_PATCH == 'true'
        shell: bash
        run: |
          echo "GITHUB_WORKSPACE şu an neresi: $GITHUB_WORKSPACE"
          
          # HATA ALDIĞIMIZ KISIM BURASIYDI. ARTIK YEDEKTEN ÇALIŞTIRIYORUZ:
          
          # Eğer dosya yedekte de yoksa işlemi durdur (böyle bir şey olmamalı)
          if [ ! -f "/tmp/Patches_Backup/backport_patches.sh" ]; then
            echo "HATA: backport_patches.sh yedek klasöründe (/tmp) bile bulunamadı!"
            exit 1
          fi

          # 1. Dosyadaki olası Windows (CRLF) satır sonlarını Linux (LF) formatına çeviriyoruz:
          sed -i 's/\r$//' /tmp/Patches_Backup/backport_patches.sh
          
          cd $GITHUB_WORKSPACE/device_kernel
          echo "[+] Backport script uygulanıyor..."
          
          # SCRIPTİ YEDEK KLASÖRÜNDEN ÇALIŞTIR:
          bash "/tmp/Patches_Backup/backport_patches.sh"
          
          echo "[+] Backport script tamamlandı."

      - name: 🩹 Apply Custom SUSFS Memfd (Python Injection)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          echo "[+] Yama betiği (Python) oluşturuluyor..."
          cat << 'EOF' > inject_memfd.py
          import os, re
          def append_after(file_path, marker, text):
              try:
                  with open(file_path, 'r') as f: content = f.read()
                  if marker in content and "CONFIG_KSU_SUSFS_SUS_MEMFD" not in content[content.find(marker):content.find(marker)+500]:
                      content = content.replace(marker, marker + "\n" + text)
                      with open(file_path, 'w') as f: f.write(content)
                      print(f"[+] Kod eklendi: {file_path}")
                  else:
                      print(f"[*] Zaten guncel veya hedef bulunamadi: {file_path}")
              except Exception as e: print(f"[!] Hata {file_path}: {e}")

          # 1. fs/susfs.c
          append_after('fs/susfs.c', '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP', 
          '#ifdef CONFIG_KSU_SUSFS_SUS_MEMFD\nstatic DEFINE_MUTEX(susfs_mutex_lock_sus_memfd);\nstatic LIST_HEAD(LH_SUS_MEMFD);\n\nint susfs_add_sus_memfd(void __user **user_info) {\n\tstruct st_susfs_sus_memfd_list *cursor;\n\tstruct st_susfs_sus_memfd_list *new_list = NULL;\n\tstruct st_susfs_sus_memfd info = {0};\n\n\tif (copy_from_user(&info, (struct st_susfs_sus_memfd __user*)*user_info, sizeof(info))) {\n\t\tSUSFS_LOGE("failed copying from userspace\\n");\n\t\tinfo.err = -EFAULT;\n\t\tgoto out_copy_to_user;\n\t}\n\n\tmutex_lock(&susfs_mutex_lock_sus_memfd);\n\tlist_for_each_entry(cursor, &LH_SUS_MEMFD, list) {\n\t\tif (unlikely(!strcmp(info.target_pathname, cursor->info.target_pathname))) {\n\t\t\tSUSFS_LOGE("target_pathname: \'%s\' is already created in LH_SUS_MEMFD\\n", info.target_pathname);\n\t\t\tmutex_unlock(&susfs_mutex_lock_sus_memfd);\n\t\t\tinfo.err = -EEXIST;\n\t\t\tgoto out_copy_to_user;\n\t\t}\n\t}\n\tmutex_unlock(&susfs_mutex_lock_sus_memfd);\n\n\tnew_list = kzalloc(sizeof(struct st_susfs_sus_memfd_list), GFP_KERNEL);\n\tif (!new_list) {\n\t\tinfo.err = -ENOMEM;\n\t\tgoto out_copy_to_user;\n\t}\n\n\tmemcpy(&new_list->info, &info, sizeof(info));\n\n\tINIT_LIST_HEAD(&new_list->list);\n\tmutex_lock(&susfs_mutex_lock_sus_memfd);\n\tlist_add_tail(&new_list->list, &LH_SUS_MEMFD);\n\tmutex_unlock(&susfs_mutex_lock_sus_memfd);\n\tSUSFS_LOGI("target_pathname: \'%s\', is successfully added to LH_SUS_MEMFD\\n", new_list->info.target_pathname);\n\tinfo.err = 0;\nout_copy_to_user:\n\tif (copy_to_user(&((struct st_susfs_sus_memfd __user*)*user_info)->err, &info.err, sizeof(info.err))) {\n\t\tinfo.err = -EFAULT;\n\t}\n\tSUSFS_LOGI("CMD_SUSFS_ADD_SUS_MEMFD -> ret: %d\\n", info.err);\n\treturn info.err;\n}\n\nint susfs_sus_memfd(char *memfd_name) {\n\tstruct st_susfs_sus_memfd_list *cursor;\n\tint res = 0;\n\n\tmutex_lock(&susfs_mutex_lock_sus_memfd);\n\tlist_for_each_entry(cursor, &LH_SUS_MEMFD, list) {\n\t\tif (unlikely(!strcmp(memfd_name, cursor->info.target_pathname))) {\n\t\t\tSUSFS_LOGI("memfd_name: \'%s\' is found in LH_SUS_MEMFD, blocking memfd_create\\n", memfd_name);\n\t\t\tres = 1;\n\t\t\tbreak;\n\t\t}\n\t}\n\tmutex_unlock(&susfs_mutex_lock_sus_memfd);\n\treturn res;\n}\n#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MEMFD')

          append_after('fs/susfs.c', 'buf_ptr = info->enabled_features + copied_size;\n#endif',
          '#ifdef CONFIG_KSU_SUSFS_SUS_MEMFD\n\tinfo->err = copy_config_to_buf("CONFIG_KSU_SUSFS_SUS_MEMFD\\n", buf_ptr, &copied_size, SUSFS_ENABLED_FEATURES_SIZE);\n\tif (info->err) goto out_copy_to_user;\n\tbuf_ptr = info->enabled_features + copied_size;\n#endif')

          # 2. include/linux/susfs.h
          append_after('include/linux/susfs.h', 'struct st_susfs_sus_map                 info;\n};\n#endif',
          '\n/* sus_memfd */\n#ifdef CONFIG_KSU_SUSFS_SUS_MEMFD\nstruct st_susfs_sus_memfd {\n\tchar                    target_pathname[SUSFS_MAX_LEN_PATHNAME];\n\tint                     err;\n};\n\nstruct st_susfs_sus_memfd_list {\n\tstruct list_head                        list;\n\tstruct st_susfs_sus_memfd               info;\n};\n#endif')

          append_after('include/linux/susfs.h', 'void susfs_add_sus_map(void __user **user_info);\n#endif',
          '\n/* sus_memfd */\n#ifdef CONFIG_KSU_SUSFS_SUS_MEMFD\nint susfs_add_sus_memfd(void __user **user_info);\nint susfs_sus_memfd(char *memfd_name);\n#endif')

          # 3. include/linux/susfs_def.h
          append_after('include/linux/susfs_def.h', '#define CMD_SUSFS_ADD_SUS_MAP               0x60029', '#define CMD_SUSFS_ADD_SUS_MEMFD             0x60030')

          # 4. mm/shmem.c
          append_after('mm/shmem.c', '#include <linux/frontswap.h>', '#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif')
          
          try:
              with open('mm/shmem.c', 'r') as f: content = f.read()
              if 'susfs_sus_memfd' not in content:
                  content = re.sub(r'(goto err_name;\n\s*\})', r'\1\n\n#ifdef CONFIG_KSU_SUSFS_SUS_MEMFD\n\tif (susfs_sus_memfd(name)) {\n\t\terror = -EFAULT;\n\t\tgoto err_name;\n\t}\n#endif\n', content)
                  with open('mm/shmem.c', 'w') as f: f.write(content)
                  print("[+] Eklendi: mm/shmem.c (memfd_create kancasi)")
          except Exception as e: print(f"[!] Hata mm/shmem.c: {e}")
          EOF
          
          python3 inject_memfd.py
          echo "[+] Ozel yama islemi (Python Enjeksiyonu) tamamlandi."

      - name: 🧩 Patch Kernel of NoMount (dev branch, setup.sh)
        if: env.NOMOUNT_ENABLE == 'true'
        shell: bash
        run: |
          set -x
          cd $GITHUB_WORKSPACE/device_kernel

          # Resmi setup.sh script'ini çek ve çalıştır (kernel entegrasyonunu kendisi hallediyor)
          curl -sSL https://raw.githubusercontent.com/maxsteeel/nomount/dev/kernel/setup.sh -o /tmp/nomount_setup.sh
          chmod +x /tmp/nomount_setup.sh
          sh /tmp/nomount_setup.sh

          # Defconfig'e NoMount seçeneğini ekle
          echo "CONFIG_NOMOUNT=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "[+] NoMount entegrasyonu tamamlandı (setup.sh ile)."
          
      - name: 🧰 Patch Kernel of Re:Kernel
        if: env.REKERNEL_ENABLE == 'true'
        uses: ./.github/workflows/patch-rekernel

      - name: 🛠️ Fix Re-Kernel TRANSACTION conflict
        if: env.REKERNEL_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          sed -i 's/\bTRANSACTION\b/REKERNEL_TRANSACTION/g' include/net/rekernel.h
          
      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard
           
      - name: ➕ Add Non-GKI configs to defconfig
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          DEFCONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$DEFCONFIG_FILE" << 'EOF'
          
          CONFIG_DEBUG_KERNEL=y
          CONFIG_KSU_SUSFS_SUS_MEMFD=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_KPM=y

          EOF
          echo "[+] Configler eklendi."

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      
      - name: 🧷 Setup KPatch-Next tools
        if: env.KPM_ENABLE == 'true' && env.KPM_KPATCH_NEXT == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          KPATCH_VER=$(curl -s https://api.github.com/repos/KernelSU-Next/KPatch-Next/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          echo "[+] KPatch-Next version: $KPATCH_VER"
          echo "KPATCH_VER=$KPATCH_VER" >> $GITHUB_ENV
          curl -Lo kptools        https://github.com/KernelSU-Next/KPatch-Next/releases/download/${KPATCH_VER}/kptools-linux
          curl -Lo kpimg          https://github.com/KernelSU-Next/KPatch-Next/releases/download/${KPATCH_VER}/kpimg-linux
          curl -Lo kpatch-android https://github.com/KernelSU-Next/KPatch-Next/releases/download/${KPATCH_VER}/kpatch-android
          chmod +x kptools kpimg kpatch-android
          ./kptools --version || true

      - name: 🩹 Patch Kernel Image with KPatch-Next
        if: env.KPM_ENABLE == 'true' && env.KPM_KPATCH_NEXT == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          IMAGE=out/arch/arm64/boot/Image
          PATCHED_IMAGE=out/arch/arm64/boot/Image.kp

          if [ ! -f "$IMAGE" ]; then
            echo "[-] Kernel Image bulunamadı ($IMAGE), KPatch adımı atlanıyor."
            exit 0
          fi

          ./kptools -i "$IMAGE" -l || true
          ./kptools -p -i "$IMAGE" -k ./kpimg -o "$PATCHED_IMAGE"
          echo "KPATCH_PATCHED=true" >> $GITHUB_ENV
          echo "[+] Kernel Image KPatch-Next ile yamalandı: $PATCHED_IMAGE"

      - name: 📝 Save build metadata
        if: env.KPM_ENABLE == 'true' && env.KPM_KPATCH_NEXT == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          mkdir -p build/out/meta
          {
            echo "KPatch-Next Version: $KPATCH_VER"
          } > build/out/meta/build-info.txt
          echo "[+] build-info.txt oluşturuldu."
          
      - name: ❗ Samsung Kernel Pack Process
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # Var
          TIME=$(date +"%Y%m%d%H%M%S")
          KERNEL_PATH=build/out/d2s/Image
          KERNEL_OFFSET=0x00008000
          RAMDISK_OFFSET=0xF0000000
          SECOND_OFFSET=0xF0000000
          TAGS_OFFSET=0x00000100
          BASE=0x10000000
          CMDLINE='loop.max_part=7'
          HASHTYPE=sha1
          HEADER_VERSION=1
          OS_PATCH_LEVEL=2025-08
          OS_VERSION=16.0.0
          PAGESIZE=2048
          RAMDISK=build/out/d2s/ramdisk.cpio.gz
          OUTPUT_FILE=build/out/d2s/boot.img
          BOARD=SRPSC14B009KU
          mkdir -p build/out/d2s/zip/files
          mkdir -p build/out/d2s/zip/META-INF/com/google/android

          # KPatch-Next ile yamalanmış Image varsa onu kullan, yoksa orijinal Image'i kullan
          if [ "${{ env.KPM_ENABLE }}" == "true" ] && [ "${{ env.KPM_KPATCH_NEXT }}" == "true" ] && [ -f out/arch/arm64/boot/Image.kp ]; then
            cp -f out/arch/arm64/boot/Image.kp build/out/d2s/Image
            echo "[+] KPatch-Next ile yamalanmış kernel image kullanılıyor."
          else
            cp -f out/arch/arm64/boot/Image build/out/d2s/Image
          fi

          ./toolchain/mkdtimg cfg_create build/out/d2s/dtb.img build/dtconfigs/exynos9825.cfg -d out/arch/arm64/boot/dts/exynos
          ./toolchain/mkdtimg cfg_create build/out/d2s/dtbo.img build/dtconfigs/d2s.cfg -d out/arch/arm64/boot/dts/samsung
          pushd build/ramdisk > /dev/null
          find . ! -name . | LC_ALL=C sort | cpio -o -H newc -R root:root | gzip > ../out/d2s/ramdisk.cpio.gz || abort
          popd > /dev/null
          ./toolchain/mkbootimg --base $BASE --board $BOARD --cmdline "$CMDLINE" --hashtype $HASHTYPE --header_version $HEADER_VERSION --kernel $KERNEL_PATH --kernel_offset $KERNEL_OFFSET --os_patch_level $OS_PATCH_LEVEL --os_version $OS_VERSION --pagesize $PAGESIZE --ramdisk $RAMDISK --ramdisk_offset $RAMDISK_OFFSET --second_offset $SECOND_OFFSET --tags_offset $TAGS_OFFSET -o $OUTPUT_FILE
          cp build/out/d2s/boot.img build/out/d2s/zip/files/boot.img
          cp build/out/d2s/dtb.img build/out/d2s/zip/files/dtb.img
          cp build/out/d2s/dtbo.img build/out/d2s/zip/files/dtbo.img
          cp build/update-binary build/out/d2s/zip/META-INF/com/google/android/update-binary
          cp build/updater-script build/out/d2s/zip/META-INF/com/google/android/updater-script

          # KPatch-Next kullanıldıysa kpatch-android aracını da pakete ekle
          if [ "${{ env.KPM_ENABLE }}" == "true" ] && [ "${{ env.KPM_KPATCH_NEXT }}" == "true" ] && [ -f kpatch-android ]; then
            cp kpatch-android build/out/d2s/zip/files/kpatch-android
          fi

          # KPatch-Next build metadata dosyasını zip'in köküne ekle
          if [ -f build/out/meta/build-info.txt ]; then
            cp build/out/meta/build-info.txt build/out/d2s/zip/build-info.txt
            echo "[+] build-info.txt zip paketine eklendi."
          fi

          mkdir tmp
          cp -rp ./build/out/d2s/zip/* tmp
          cd tmp
          7za a -mx9 tmp.zip *
          cd ..
          cp -fp tmp/tmp.zip ${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-${{ env.PACK_METHOD }}.zip
          rm -rf tmp
          echo "PACK_NAME=${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-${{ env.PACK_METHOD }}.zip" >> $GITHUB_ENV

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
