name: Build Samsung Note 10 Plus (OneUI A15)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "samsung_note_10plus"
  DEVICE_CODENAME : "d2s"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE : "https://github.com/JackA1ltman/ExtremeKernel_noksu.git"
  KERNEL_BRANCH : "main"

  CLANG_SOURCE : "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "exynos9820_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "xxksu" # xxksu, rsuntk , next, resukisu and sukisu

  SUSFS_ENABLE : true
  SUSFS_FIXED : true
  SUSFS_TRY_UMOUNT : true

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "oneui_a15"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "Anykernel3" # Anykernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false" # if u want pack kernel modules (.ko) into Anykernel3.

  KERNELSU_METHOD: "shell" # shell, manual and only.

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches" # [your_name]/[your_patch] -> gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "samsung_kernel" # [your_branch] -> main

  SUSFS_FOLDER_FIXED: "note10_plus_exyons9850" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "susfs_fixed" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2

  REKERNEL_ENABLE: "false" # if u need Re:Kernel.
  DROIDSPACES_ENABLE: "false" # if u need Droidspaces or LXC/Docker.
  NOMOUNT_ENABLE: "true" # if u need NoMount.

  HOOK_METHOD: "syscall" # Manual hook method ->  syscall.

  KERNEL_PATCH: "true" # If your kernel version is <= 4.9, you have the option of enabling the patch to patch the kernel_write and kernel_read functions.

  KPM_ENABLE: "true" # Anyone devices. 
  KPM_INLINE: "true" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "true" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: "true" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only Anykernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "false" # Output build errors.
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "true" # Merge config files.
  MERGE_CONFIG_FILES: "d2s.config"

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: Samsung Note 10 Plus (OneUI A15)
    runs-on: ubuntu-latest # u can changed to ubuntu 22.04, and need container set ubuntu-latest
    # container: archlinux/archlinux:latest # if u need use arch linux -> archlinux/archlinux:latest or ubuntu 20.04 -> ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 🛡️ Backup Patches Directory
        shell: bash
        run: |
          echo "[+] Patches klasörü güvenli bölgeye (/tmp/Patches_Backup) kopyalanıyor..."
          cp -r $GITHUB_WORKSPACE/Patches /tmp/Patches_Backup
          echo "[+] Yedekleme tamam. /tmp/Patches_Backup içeriği:"
          ls -la /tmp/Patches_Backup
      # ========================================

      - name: 🔍 List Patches directory
        shell: bash
        run: |
          ls -la $GITHUB_WORKSPACE/Patches/ || echo "Patches Workspace'de bulunamadı (Zaten yedekledik)"
          echo "---"
          find /tmp/Patches_Backup -maxdepth 2 -type f

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🚀 Apply Backport Patches
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          echo "[+] backport_patches.sh scripti aranıyor..."
          
          # 1. DİNAMİK ARAMA: Klasör iç içe geçmiş olsa bile dosyayı bulur
          SCRIPT_PATH=$(find /tmp/Patches_Backup -name "backport_patches.sh" | head -n 1)
          
          if [ -z "$SCRIPT_PATH" ]; then
              echo "[-] KRİTİK HATA: backport_patches.sh hiçbir yedek klasöründe bulunamadı!"
              exit 1
          fi
          
          # Dosyayı kernel dizinine kopyala
          cp "$SCRIPT_PATH" ./
          
          # 2. CRLF DÜZELTMESİ (Görünmez Windows ^M karakterlerini siler)
          sed -i 's/\r$//' backport_patches.sh
          
          # Çalıştırma yetkisi ver
          chmod +x backport_patches.sh
          
          echo "[+] Script çalıştırılıyor..."
          bash backport_patches.sh
          
          echo "[+] Backport yamaları başarıyla uygulandı!"
          
          # Dosyayı kernel dizinine kopyala
          cp "$SCRIPT_PATH" ./
          
          # 2. CRLF DÜZELTMESİ (Görünmez Windows ^M karakterlerini siler)
          sed -i 's/\r$//' backport_patches.sh
          
          # Çalıştırma yetkisi ver
          chmod +x backport_patches.sh
          
          echo "[+] Script çalıştırılıyor..."
          bash backport_patches.sh
          
          echo "[+] Backport yamaları başarıyla uygulandı!"

      - name: ⚖️ Apply & Fix SBalance Patch (4.14 Backport)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          PATCH_FILE="/tmp/Patches_Backup/sbalance.patch"
          echo "[+] SBalance yaması aranıyor..."
          
          if [ ! -f "$PATCH_FILE" ]; then
              echo "[-] KRİTİK HATA: sbalance.patch yedek klasöründe bulunamadı!"
              exit 1
          fi
          
          echo "[+] CRLF temizliği yapılıyor..."
          sed -i 's/\r$//' "$PATCH_FILE"
          
          echo "[+] Yama çekirdeğe işleniyor..."
          patch -p1 < "$PATCH_FILE" || true
          
          echo "[+] Dosya sisteminin güncellenmesi için 3 saniye bekleniyor..."
          sleep 3
          
          # Güvenli Makefile Onarımı
          echo "[+] sbalance.o Makefile'a ekleniyor..."
          if ! grep -q "sbalance.o" kernel/irq/Makefile; then
              echo "obj-y += sbalance.o" >> kernel/irq/Makefile
          fi
          rm -f kernel/irq/Makefile.rej
          
          # sbalance.c dosyası var mı DÖNGÜSÜ (Garantili kontrol)
          if [ ! -f "kernel/irq/sbalance.c" ]; then
              echo "[-] sbalance.c hala bulunamadı! Yama bozuk olabilir veya dosya oluşturulamadı."
              cat kernel/irq/*.rej || true
              exit 1
          fi
          
          echo "[+] SBalance C kodları 4.14 mimarisi için onarılıyor..."
          
          # 1. Kütüphane eklentisi (Sadece BİR KERE ekliyoruz)
          sed -i '1s/^/#include <linux\/cpufreq.h>\n/' kernel/irq/sbalance.c
          
          # 2. arch_scale_cpu_capacity uyarlaması
          sed -i 's/arch_scale_cpu_capacity(cpu)/arch_scale_cpu_capacity(NULL, cpu)/g' kernel/irq/sbalance.c
          
          # 3. Kapanış parantezleri
          echo -e "\n\t}\n}" >> kernel/irq/sbalance.c
          
          echo "[+] SBalance yaması ve Backport onarımı kusursuz tamamlandı!"


      - name: 🚀 Apply Native 4.14 SSG I/O Scheduler & Fixes
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          echo "[+] 4.14 Uyumlu SSG I/O ana yaması çekiliyor..."
          curl -sL "https://github.com/manipvlator/los_kernel_xiaomi_sm6150/commit/5f39c5f68f9a8890cbf7639e35a3edb6f873bd65.patch" -o ssg_414_base.patch
          
          echo "[+] SSG I/O ek düzeltme yamaları (Fixes) çekiliyor..."
          curl -sL "https://github.com/manipvlator/los_kernel_xiaomi_sm6150/commit/a181d8276b765c481b7643830fd49153da7d28b2.patch" -o ssg_414_fix1.patch
          curl -sL "https://github.com/manipvlator/los_kernel_xiaomi_sm6150/commit/4aaec6194aa556a473bf1cc82afde27825e16dd1.patch" -o ssg_414_fix2.patch
          
          echo "[+] CRLF temizliği yapılıyor..."
          sed -i 's/\r$//' ssg_414_base.patch ssg_414_fix1.patch ssg_414_fix2.patch
          
          echo "[+] Yamalar sırayla (Ana Yama -> Düzeltme 1 -> Düzeltme 2) uygulanıyor..."
          patch -p1 < ssg_414_base.patch || true
          patch -p1 < ssg_414_fix1.patch || true
          patch -p1 < ssg_414_fix2.patch || true
          
          echo "[+] Güvenlik önlemleri (Makefile ve Kconfig çakışmaları için)..."
          if ! grep -q "ssg-iosched.o" block/Makefile; then
              echo "" >> block/Makefile
              echo "obj-\$(CONFIG_MQ_IOSCHED_SSG) += ssg-iosched.o" >> block/Makefile
          fi
          
          # Başarısız yama artıklarını temizle ki derleyici (Make) patlamasın
          find block/ -name "*.rej" -type f -delete
          
          echo "[+] SSG, Defconfig dosyalarına işleniyor ve varsayılan yapılıyor!"
          find arch/arm64/configs -type f -name "*defconfig" -exec sh -c '
              echo "" >> "{}"
              echo "CONFIG_MQ_IOSCHED_SSG=y" >> "{}"
              echo "# CONFIG_MQ_IOSCHED_SSG_CGROUP is not set" >> "{}"
              sed -i "s/CONFIG_DEFAULT_IOSCHED=.*/CONFIG_DEFAULT_IOSCHED=\"ssg\"/g" "{}"
          ' \;
          
          echo "[+] 4.14 Native SSG ve ek yamaları başarıyla entegre edildi!"

      - name: ⚡ Apply Additional Optimization Patches (other_opt)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          echo "[+] Optimizasyon yamaları geçici olarak klonlanıyor..."
          git clone --depth=1 https://github.com/fatalcoder524/kernel_patches_additional.git /tmp/opt_patches
          
          echo "[+] other_opt klasöründeki yamalar sırayla test edilip uygulanıyor..."
          for patch_file in /tmp/opt_patches/other_opt/*.patch; do
              echo "--------------------------------------------------------"
              echo "[>] İşleniyor: $(basename "$patch_file")"
              
              # ZEKİ FİLTRE: Eğer yama cpufreq.c'yi değiştiriyorsa veya new_data içeriyorsa atla!
              if grep -q "get_cpumask_min_limit" "$patch_file" || grep -q "cpufreq.c" "$patch_file"; then
                  echo "[-] UYARI: $(basename "$patch_file") yaması 4.14 cpufreq API'si ile uyumsuz. Pas geçiliyor!"
                  continue
              fi
              
              # Windows/Linux satır sonu (CRLF) uyumsuzluklarını temizle
              sed -i 's/\r$//' "$patch_file"
              
              # Yamayı uygula
              patch -p1 < "$patch_file" || echo "[-] UYARI: Yama uygulanamadı, pas geçildi!"
          done
          echo "--------------------------------------------------------"
          
          echo "[+] Temizlik yapılıyor..."
          rm -rf /tmp/opt_patches
          find . -type f -name "*.rej" -delete
          
          echo "[+] Uyumlu optimizasyon yamaları başarıyla entegre edildi!"

      - name: 🚀 Set Maple as Default I/O Scheduler
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          echo "[+] Maple I/O Scheduler defconfig dosyalarına işleniyor..."
          find arch/arm64/configs -type f -name "*defconfig" -exec sh -c '
              echo "" >> "{}"
              
              # Maple modülünün çekirdeğe gömülü derlenmesini garantiliyoruz
              echo "CONFIG_IOSCHED_MAPLE=y" >> "{}"
              
              # Eski varsayılanı (cfq, ssg, noop vb.) eziyoruz
              sed -i "s/CONFIG_DEFAULT_IOSCHED=.*/CONFIG_DEFAULT_IOSCHED=\"maple\"/g" "{}"
              
              # Eğer config dosyasında hiç DEFAULT_IOSCHED tanımı yoksa zorla ekliyoruz
              if ! grep -q "CONFIG_DEFAULT_IOSCHED=\"maple\"" "{}"; then
                  echo "CONFIG_DEFAULT_IOSCHED=\"maple\"" >> "{}"
              fi
          ' \;
          
          echo "[+] Maple başarıyla varsayılan zamanlayıcı olarak ayarlandı!"

      - name: 🚀 Enable FQ-CoDel (Network Scheduler)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          echo "[+] FQ-CoDel için QoS Ana Şalterleri açılıyor ve ayarlanıyor..."
          find arch/arm64/configs -type f -name "*defconfig" -exec sh -c '
              echo "" >> "{}"
              
              # 1. QoS ve Ağ Zamanlama Ana Şalterlerini Açıyoruz (ZORUNLU BAĞIMLILIK)
              echo "CONFIG_NET_SCHED=y" >> "{}"
              
              # 2. FQ-CoDel Sürücüsünü Aktif Ediyoruz
              echo "CONFIG_NET_SCH_FQ_CODEL=y" >> "{}"
              echo "CONFIG_DEFAULT_FQ_CODEL=y" >> "{}"
              
              # 3. Varsayılan Zamanlayıcıyı fq_codel Olarak Değiştiriyoruz
              sed -i "s/CONFIG_DEFAULT_NET_SCH=.*/CONFIG_DEFAULT_NET_SCH=\"fq_codel\"/g" "{}"
              
              # Eğer CONFIG_DEFAULT_NET_SCH satırı orijinal dosyada hiç yoksa zorla ekliyoruz
              if ! grep -q "CONFIG_DEFAULT_NET_SCH=\"fq_codel\"" "{}"; then
                  echo "CONFIG_DEFAULT_NET_SCH=\"fq_codel\"" >> "{}"
              fi
          ' \;
          
          echo "[+] FQ-CoDel başarıyla defconfig'e işlendi!"    
          
      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🔒 Apply SuSFS memfd Backport Patch
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          echo "[+] SuSFS için memfd yaması çekiliyor..."
          curl -sL "https://github.com/fatalcoder524/kernel_patches_additional/commit/598b8b81224ce477cfbc1dbf475a6e6549b83452.patch" -o sus_memfd.patch
          
          echo "[+] CRLF (Windows satır sonu) formatı temizleniyor..."
          sed -i 's/\r$//' sus_memfd.patch
          
          echo "[+] memfd yaması kernela işleniyor..."
          # -p1 standart yoldur, eğer patlarsa -p2 ile bir alt dizini dener.
          patch -p1 --no-backup-if-mismatch < sus_memfd.patch || patch -p2 < sus_memfd.patch || true
          
          echo "[+] Hata kontrolü yapılıyor (.rej dosyaları)..."
          # Eğer patch uyuşmazlıktan dolayı bazı satırları reddederse, neyi reddettiğini loglarda gösterir.
          if ls *.rej 1> /dev/null 2>&1; then
              echo "[-] DİKKAT: Bazı satırlar yamalanamadı! (Reddedilen dosyalar aşağıdadır):"
              find . -name "*.rej" -exec cat {} \;
          else
              echo "[+] memfd yaması kusursuz uygulandı!"
          fi

    
      - name: 🧩 Patch Kernel of NoMount (master branch, setup.sh)
        if: env.NOMOUNT_ENABLE == 'true'
        shell: bash
        run: |
          set -x
          cd $GITHUB_WORKSPACE/device_kernel

          # Resmi setup.sh script'ini master branch'ten çek ve çalıştır
          curl -sSL https://raw.githubusercontent.com/maxsteeel/nomount/master/kernel/setup.sh -o /tmp/nomount_setup.sh
          chmod +x /tmp/nomount_setup.sh
          sh /tmp/nomount_setup.sh

          # Defconfig'e NoMount seçeneğini ekle
          echo "CONFIG_NOMOUNT=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "[+] NoMount entegrasyonu tamamlandı (setup.sh master branch ile)."
          
      - name: 🧰 Patch Kernel of Re:Kernel
        if: env.REKERNEL_ENABLE == 'true'
        uses: ./.github/workflows/patch-rekernel

      - name: 🛠️ Fix Re-Kernel TRANSACTION conflict
        if: env.REKERNEL_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          sed -i 's/\bTRANSACTION\b/REKERNEL_TRANSACTION/g' include/net/rekernel.h
          
      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces
           
      - name: ➕ Add Non-GKI configs to defconfig
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          DEFCONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          echo "[+] Samsung Knox ve DEFEX kısıtlamaları zorla siliniyor..."
          sed -i 's/CONFIG_SEC_DEFEX=y/# CONFIG_SEC_DEFEX is not set/g' "$DEFCONFIG_FILE"
          sed -i 's/CONFIG_SEC_RESTRICT_SETUID=y/# CONFIG_SEC_RESTRICT_SETUID is not set/g' "$DEFCONFIG_FILE"
          sed -i 's/CONFIG_SEC_RESTRICT_FORK=y/# CONFIG_SEC_RESTRICT_FORK is not set/g' "$DEFCONFIG_FILE"
          sed -i 's/CONFIG_SEC_RESTRICT_ROOTING=y/# CONFIG_SEC_RESTRICT_ROOTING is not set/g' "$DEFCONFIG_FILE"
          sed -i 's/CONFIG_PROCA=y/# CONFIG_PROCA is not set/g' "$DEFCONFIG_FILE"
          sed -i 's/CONFIG_TIMA=y/# CONFIG_TIMA is not set/g' "$DEFCONFIG_FILE"
          sed -i 's/CONFIG_KNOX_KAP=y/# CONFIG_KNOX_KAP is not set/g' "$DEFCONFIG_FILE"
          sed -i 's/CONFIG_SECURITY_DSMSA=y/# CONFIG_SECURITY_DSMSA is not set/g' "$DEFCONFIG_FILE"
          
          cat >> "$DEFCONFIG_FILE" << 'EOF'
          
          CONFIG_DEBUG_KERNEL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_IRQ_SBALANCE=y
          CONFIG_SBALANCE_EXCLUDE_CPUS="3,6,7"
          CONFIG_IRQ_SBALANCE_POLL_MSEC=10000
          
          EOF
          

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process
          
      - name: ❗ Samsung Kernel Pack Process
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          # Var
          TIME=$(date +"%Y%m%d%H%M%S")
          KERNEL_PATH=build/out/d2s/Image
          KERNEL_OFFSET=0x00008000
          RAMDISK_OFFSET=0xF0000000
          SECOND_OFFSET=0xF0000000
          TAGS_OFFSET=0x00000100
          BASE=0x10000000
          CMDLINE='loop.max_part=7'
          HASHTYPE=sha1
          HEADER_VERSION=1
          OS_PATCH_LEVEL=2025-08
          OS_VERSION=16.0.0
          PAGESIZE=2048
          RAMDISK=build/out/d2s/ramdisk.cpio.gz
          OUTPUT_FILE=build/out/d2s/boot.img
          BOARD=SRPSC14B009KU

          mkdir -p build/out/d2s/zip/files
          mkdir -p build/out/d2s/zip/META-INF/com/google/android

          cp -f out/arch/arm64/boot/Image build/out/d2s/Image

          ./toolchain/mkdtimg cfg_create build/out/d2s/dtb.img build/dtconfigs/exynos9825.cfg -d out/arch/arm64/boot/dts/exynos
          ./toolchain/mkdtimg cfg_create build/out/d2s/dtbo.img build/dtconfigs/d2s.cfg -d out/arch/arm64/boot/dts/samsung

          pushd build/ramdisk > /dev/null
          find . ! -name . | LC_ALL=C sort | cpio -o -H newc -R root:root | gzip > ../out/d2s/ramdisk.cpio.gz || abort
          popd > /dev/null

          ./toolchain/mkbootimg --base $BASE --board $BOARD --cmdline "$CMDLINE" --hashtype $HASHTYPE --header_version $HEADER_VERSION --kernel $KERNEL_PATH --kernel_offset $KERNEL_OFFSET --os_patch_level $OS_PATCH_LEVEL --os_version $OS_VERSION --pagesize $PAGESIZE --ramdisk $RAMDISK --ramdisk_offset $RAMDISK_OFFSET --second_offset $SECOND_OFFSET --tags_offset $TAGS_OFFSET -o $OUTPUT_FILE

          cp build/out/d2s/boot.img build/out/d2s/zip/files/boot.img
          cp build/out/d2s/dtb.img build/out/d2s/zip/files/dtb.img
          cp build/out/d2s/dtbo.img build/out/d2s/zip/files/dtbo.img
          cp build/update-binary build/out/d2s/zip/META-INF/com/google/android/update-binary
          cp build/updater-script build/out/d2s/zip/META-INF/com/google/android/updater-script

          mkdir tmp
          cp -rp ./build/out/d2s/zip/* tmp
          cd tmp
          7za a -mx9 tmp.zip *
          cd ..
          cp -fp tmp/tmp.zip ${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-${{ env.PACK_METHOD }}.zip
          rm -rf tmp

          echo "PACK_NAME=${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-${{ env.PACK_METHOD }}.zip" >> $GITHUB_ENV

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
