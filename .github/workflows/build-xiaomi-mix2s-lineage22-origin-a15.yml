name: Build Xiaomi Mi MIX 2S (LineageOS 22.2 Origin A15)

on:
  workflow_call:
    inputs:
      bakasu_branch:
        description: "BakaSU branch, tag or commit"
        required: false
        type: string
        default: "main"
      kernel_name:
        description: "Kernel uname release (uname -r)"
        required: false
        type: string
        default: "4.9.337-imexplorer-perf"
      kernel_build_time:
        description: "Kernel build time shown by uname -v (date part)"
        required: false
        type: string
        default: "Mon JUL 5 11:45:14 UTC 2021"
      patch_susfs:
        description: "Apply SUSFS (base + 4.9 fixed hooks)"
        required: false
        type: boolean
        default: true
      patch_rekernel:
        description: "Apply Re:Kernel"
        required: false
        type: boolean
        default: false
      patch_droidspaces:
        description: "Apply Droidspaces"
        required: false
        type: boolean
        default: false
      patch_baseband_guard:
        description: "Apply Baseband Guard"
        required: false
        type: boolean
        default: true
      patch_baseband_guard_boot:
        description: "Baseband Guard: also protect boot partition"
        required: false
        type: boolean
        default: false
      patch_nomount:
        description: "Apply NoMount"
        required: false
        type: boolean
        default: true
      patch_fgetpriority:
        description: "Apply fgetpriority"
        required: false
        type: boolean
        default: true
      patch_vpnhide:
        description: "Apply VPNHide"
        required: false
        type: boolean
        default: false
      patch_lz4kd:
        description: "Apply LZ4K/LZ4KD zram compression (4.9)"
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      bakasu_branch:
        description: "BakaSU branch, tag or commit (default: main)"
        required: false
        default: "main"
        type: string
      kernel_name:
        description: "内核 uname 版本，即 uname -r (默认: 4.9.337-imexplorer-perf)"
        required: false
        default: "4.9.337-imexplorer-perf"
        type: string
      kernel_build_time:
        description: "内核编译时间，即 uname -v 的日期部分 (默认: Mon JUL 5 11:45:14 UTC 2021)"
        required: false
        default: "Mon JUL 5 11:45:14 UTC 2021"
        type: string
      patch_susfs:
        description: "SUSFS（基础补丁 + 4.9 fixed hooks）"
        required: false
        type: boolean
        default: true
      patch_rekernel:
        description: "Re:Kernel"
        required: false
        type: boolean
        default: false
      patch_droidspaces:
        description: "Droidspaces"
        required: false
        type: boolean
        default: false
      patch_baseband_guard:
        description: "Baseband Guard"
        required: false
        type: boolean
        default: true
      patch_baseband_guard_boot:
        description: "Baseband Guard：额外保护 boot 分区"
        required: false
        type: boolean
        default: false
      patch_nomount:
        description: "NoMount"
        required: false
        type: boolean
        default: true
      patch_fgetpriority:
        description: "fgetpriority"
        required: false
        type: boolean
        default: true
      patch_vpnhide:
        description: "VPNHide"
        required: false
        type: boolean
        default: false
      patch_lz4kd:
        description: "LZ4K/LZ4KD zram 压缩（4.9）"
        required: false
        type: boolean
        default: true

env:
  # Device env
  DEVICE_NAME : "xiaomi_mix2s"
  DEVICE_CODENAME : "polaris"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld"

  KERNEL_SOURCE : "https://github.com/imexplorer1/android_kernel_xiaomi_sdm845.git"
  KERNEL_BRANCH : "lineage-22.2-origin"

  CLANG_SOURCE : "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH : "lineage-20.0"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/xiaomi/mi845_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh"

  KERNELSU_AUTO_GET : "false" # Always use the BakaSU setup.sh above.
  KERNELSU_AUTO_FORK : "bakasu" # only bakasu

  SUSFS_FIXED : false # The evox-a15 susfs_fixed patch targets another tree layout; our own 4.9 fixed patch is applied instead.

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "lineageos22_a15"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "AnyKernel3" # AnyKernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false" # if u want pack kernel modules (.ko) into AnyKernel3.

  KERNELSU_METHOD: "shell" # shell, manual and only.
  KERNELSU_SUS_PATCH: "false" # if u need manual susfs patch to kernelsu.

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches" # [your_name]/[your_patch] -> gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "mi_kernel" # [your_branch] -> main

  SUSFS_FOLDER_FIXED: "" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2


  HOOK_METHOD: "syscall" # Manual hook method ->  syscall.

  KERNEL_PATCH: "false" # If your kernel version is <= 4.9, you have the option of enabling the patch to patch the kernel_write and kernel_read functions.

  KPM_ENABLE: "false" # Anyone devices.
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .


  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only AnyKernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "false" # Output build errors.
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "true" # Merge config files.
  MERGE_CONFIG_FILES: "vendor/xiaomi/polaris.config"

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: Xiaomi Mi MIX 2S (LineageOS 22.2 Origin A15)
    runs-on: ubuntu-24.04 # u can changed to ubuntu 22.04, and need container set ubuntu-24.04
    # container: archlinux/archlinux:latest # if u need use arch linux -> archlinux/archlinux:latest or ubuntu 20.04 -> ubuntu:focal
    env:
      KERNELSU_BRANCH: "${{ inputs.bakasu_branch || 'main' }}"
      # Patch switches (rendered as checkboxes in the Run workflow UI)
      SUSFS_ENABLE: ${{ inputs.patch_susfs }}
      REKERNEL_ENABLE: ${{ inputs.patch_rekernel }}
      DROIDSPACES_ENABLE: ${{ inputs.patch_droidspaces }}
      BASEBAND_GUARD_ENABLE: ${{ inputs.patch_baseband_guard }}
      BASEBAND_GUARD_BOOT: ${{ inputs.patch_baseband_guard_boot }}
      NOMOUNT_ENABLE: ${{ inputs.patch_nomount }}
      FGETPRIORITY_ENABLE: ${{ inputs.patch_fgetpriority }}
      VPNHIDE_ENABLE: ${{ inputs.patch_vpnhide }}
      LZ4KD_ENABLE: ${{ inputs.patch_lz4kd }}
      KBUILD_BUILD_VERSION: "1"
      KBUILD_BUILD_TIMESTAMP: "${{ inputs.kernel_build_time || 'Mon JUL 5 11:45:14 UTC 2021' }}"
      LOCALVERSION: ""
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🩹 Patch SUSFS 4.9 Fixed Hooks
        if: env.SUSFS_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          if grep -q "susfs_is_current_app_uid" fs/stat.c && grep -q "SUSFS_IS_INODE_OPEN_REDIRECT(inode)" fs/proc/task_mmu.c; then
            echo "[+] SUSFS 4.9 fixed hooks already present, Skipped."
            exit 0
          fi

          cp /tmp/Patches/susfs/susfs_fixed_to_4.9.patch ./
          patch -p1 < susfs_fixed_to_4.9.patch
          rm -f susfs_fixed_to_4.9.patch fs/stat.c.rej fs/proc/task_mmu.c.rej
          echo "[+] SUSFS 4.9 fixed hooks applied successfully."

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd $GITHUB_WORKSPACE/device_kernel

          # Nothing

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: ⛔ Patch Kernel of fgetpriority
        uses: ./.github/workflows/patch-fgetpriority

      - name: 🛜 Patch Kernel of VPNHide
        uses: ./.github/workflows/patch-vpnhide

      - name: 🗜️ Patch Kernel of LZ4KD
        uses: ./.github/workflows/patch-lz4kd

      - name: 🏷️ Set Kernel UTS Name
        shell: bash
        env:
          KERNEL_NAME: "${{ inputs.kernel_name || '4.9.337-imexplorer-perf' }}"
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          NAME="$(printf '%s' "$KERNEL_NAME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          BASE="$(awk '/^VERSION =/{v=$3} /^PATCHLEVEL =/{p=$3} /^SUBLEVEL =/{s=$3} END{print v"."p"."s}' Makefile)"
          [ -z "$NAME" ] && NAME="${BASE}-imexplorer-perf"

          if [[ "$NAME" == "$BASE" ]]; then
            LOCALVER=""

          elif [[ "$NAME" == "$BASE"-* ]]; then
            LOCALVER="${NAME#"$BASE"}"

          else
            LOCALVER="-$NAME"
            echo "[-] '$NAME' does not start with '$BASE', kernel will be '${BASE}${LOCALVER}'."
          fi

          # Avoid the '-dirty'/git describe suffix from scripts/setlocalversion.
          : > .scmversion

          DEFCONFIG="$GITHUB_WORKSPACE/device_kernel/arch/$KERNEL_ARCH/configs/$DEFCONFIG_NAME"
          ESCAPED="$(printf '%s' "$LOCALVER" | sed 's/[&|\\]/\\&/g')"
          sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"$ESCAPED\"|" "$DEFCONFIG"

          echo "[+] CONFIG_LOCALVERSION=\"$LOCALVER\""
          echo "[+] uname -r will be: ${BASE}${LOCALVER}"
          echo "[+] uname -v will be: #$KBUILD_BUILD_VERSION SMP PREEMPT $KBUILD_BUILD_TIMESTAMP"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
